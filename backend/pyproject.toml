[project]
name = "formation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.138.0",
    "matplotlib>=3.10.3",
    "keras>=3.12.0",
    "mlflow>=3.1.0",
    "numpy>=2.3.5",
    "pandas>=2.2,<3",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.2.9",
    "python-dotenv>=1.1.0",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.0.41",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "scikit-learn>=1.7.0",
    "shap>=0.46.0",
    "uvicorn>=0.49.0",
    "xgboost>=3.0.0",
    "codecarbon>=3.0.0",
    "optuna>=4.0.0",
]

[project.scripts]
build-gold-dataset = "indusense.processing.ingestion:main"
indusense-pipeline = "indusense.processing.ingestion:main"
indusense-api = "indusense.api:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
